name: ms

services:
  postgres:
    image: postgres:16-alpine
    container_name: ms-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lechisa2829
      POSTGRES_DB: ms_db
    ports:
      - "5432:5432"
    volumes:
      - ms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ms_postgres_data:
    external: true
